<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Not Found</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: system-ui, Arial;
  display: flex;
  align-items: center;
  justify-content: center;

  background: radial-gradient(circle at top, #002868, #050914);
  color: white;
  text-align: center;
  overflow: hidden;
}

/* floating glow */
.bg-glow {
  position: absolute;
  width: 400px;
  height: 400px;
  background: rgba(179, 25, 66, 0.3);
  filter: blur(120px);
  border-radius: 50%;
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(-20px); }
  50% { transform: translateY(20px); }
  100% { transform: translateY(-20px); }
}

.container {
  z-index: 2;
  max-width: 600px;
  padding: 20px;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

h1 {
  font-size: 90px;
  margin: 0;
  color: #b31942;
}

p {
  font-size: 18px;
  opacity: 0.85;
}

button {
  margin-top: 20px;
  padding: 12px 18px;
  border: none;
  border-radius: 999px;
  cursor: pointer;

  background: linear-gradient(135deg, #002868, #00122e);
  color: white;
  font-weight: bold;

  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="container">
  <h1>404</h1>
  <p>🇺🇸 Page not found in the Constitutional Archive</p>
  <p>The document you are looking for may have been moved or does not exist.</p>

  <button onclick="window.location.href='index.html'">
    Return to AI
  </button>
</div>

</body>
</html>
