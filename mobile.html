<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>🇺🇸 AI Mobile</title>

<style>
/* =========================
   BASE MOBILE APP STYLE
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui;
}

body {
  height: 100vh;
  overflow: hidden;
  background: #050914;
  color: white;
}

/* SAFE AREA (iPhone notch fix) */
.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* HEADER */
.header {
  background: linear-gradient(90deg, #002868, #001a3a);
  padding: 14px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header span {
  font-size: 12px;
  opacity: 0.7;
}

/* CHAT */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* MESSAGES */
.msg {
  max-width: 85%;
  padding: 10px 12px;
  border-radius: 14px;
  animation: pop 0.15s ease;
  font-size: 15px;
}

@keyframes pop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.user {
  background: #b31942;
  align-self: flex-end;
}

.ai {
  background: rgba(255,255,255,0.08);
  align-self: flex-start;
  border: 1px solid rgba(255,255,255,0.05);
}

/* INPUT BAR */
.inputBar {
  display: flex;
  gap: 8px;
  padding: 25;
  background: #0a1220;
  border-top: 1px solid rgba(255,255,255,0.08);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.06);
  color: white;
  font-size: 16px;
}

button {
  padding: 12px 16px;
  border-radius: 999px;
  border: none;
  background: #002868;
  color: white;
  font-weight: bold;
}

/* REMOVE MOBILE SCROLL BUGS */
html, body {
  height: 100%;
  overflow: hidden;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    🇺🇸 Constitutional AI
    <span>Mobile Mode</span>
  </div>

  <div id="chat"></div>

  <div class="inputBar">
    <input id="input" placeholder="Ask anything..." />
    <button id="sendBtn">Send</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
