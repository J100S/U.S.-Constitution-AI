<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🇺🇸 Constitution AI</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to bottom, #0a1f44, white, #b22234);
}

header {
  background: #0a1f44;
  color: white;
  padding: 20px;
  font-size: 26px;
  text-align: center;
  border-bottom: 4px solid #b22234;
}

#chat {
  width: 90%;
  max-width: 700px;
  margin: 20px auto;
  background: white;
  height: 400px;
  overflow-y: auto;
  border-radius: 10px;
  padding: 10px;
}

.user { color: #0a1f44; font-weight: bold; }
.bot { color: #b22234; margin-bottom: 10px; }

input {
  width: 70%;
  padding: 10px;
}

button {
  padding: 10px;
  background: #b22234;
  color: white;
  border: none;
}
</style>
</head>

<body>

<header>🇺🇸 Constitution AI</header>

<div id="chat"></div>

<center>
<input id="input" placeholder="Ask about rights, amendments, etc">
<button onclick="ask()">Ask</button>
</center>

<script src="script.js"></script>

</body>
</html>
