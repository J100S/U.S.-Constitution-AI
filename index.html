<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constitution Q&A - Powered by Neural Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            max-height: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #003366 0%, #004488 100%);
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #002244;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #f8f9fb;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 2px;
        }

        .response-section {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            margin-top: 8px;
        }

        .section-title {
            font-weight: 700;
            color: #003366;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .section-name {
            font-size: 13px;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .section-text {
            font-size: 13px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 12px;
            max-height: 150px;
            overflow-y: auto;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .score-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .score-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            min-width: 100px;
        }

        .score-bar-bg {
            flex: 1;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .score-percent {
            font-size: 12px;
            font-weight: 700;
            color: #667eea;
            min-width: 40px;
            text-align: right;
        }

        .interpretation {
            font-size: 13px;
            color: #333;
            font-weight: 500;
            padding: 8px 0;
        }

        .input-container {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="text"]::placeholder {
            color: #999;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .welcome-message {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin: auto;
        }

        .welcome-message h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .welcome-message p {
            margin-bottom: 8px;
        }

        .suggestion {
            display: inline-block;
            background: #f0f4ff;
            color: #667eea;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin: 3px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e0e8ff;
        }

        .suggestion:hover {
            background: #e0e8ff;
            border-color: #667eea;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: loading 1.4s infinite;
            margin: 0 2px;
        }

        .loading:nth-child(1) { animation-delay: 0s; }
        .loading:nth-child(2) { animation-delay: 0.2s; }
        .loading:nth-child(3) { animation-delay: 0.4s; }

        @keyframes loading {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇺🇸 Constitution Q&A</h1>
            <p>Neural Network-powered answers from the U.S. Constitution</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="message-content">
                    <div class="welcome-message">
                        <h2>Welcome! 👋</h2>
                        <p>Ask me anything about the U.S. Constitution.</p>
                        <p style="margin-top: 15px; font-size: 13px; color: #666;">Try asking:</p>
                        <div style="margin-top: 10px;">
                            <span class="suggestion" onclick="askQuestion('How does Congress work?')">How does Congress work?</span>
                            <span class="suggestion" onclick="askQuestion('What is the First Amendment?')">First Amendment</span>
                            <span class="suggestion" onclick="askQuestion('Who is the President?')">President</span>
                            <span class="suggestion" onclick="askQuestion('What are my rights?')">My Rights</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-group">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Ask a question about the Constitution..."
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="submitQuestion()">Ask</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const questionInput = document.getElementById('questionInput');

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                submitQuestion();
            }
        }

        function askQuestion(question) {
            questionInput.value = question;
            questionInput.focus();
            setTimeout(submitQuestion, 100);
        }

        async function submitQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            // Add user message
            addMessage(question, 'user');
            questionInput.value = '';
            questionInput.focus();

            // Show loading
            const loadingMsg = addMessage('<div class="loading"></div><div class="loading"></div><div class="loading"></div>', 'assistant');

            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) throw new Error('Failed to get answer');

                const data = await response.json();

                // Remove loading message
                loadingMsg.remove();

                // Add assistant response
                addResponse(data);

            } catch (error) {
                loadingMsg.remove();
                addMessage('Sorry, there was an error. Please try again.', 'assistant');
            }
        }

        function addMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = content;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return messageDiv;
        }

        function addResponse(data) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const responseHtml = `
                <div class="response-section">
                    <div class="section-title">📜 Relevant Section:</div>
                    <div class="section-name">${escapeHtml(data.section_name)}</div>
                    
                    <div class="section-title">📖 Text:</div>
                    <div class="section-text">${escapeHtml(data.section_text)}</div>
                    
                    <div class="score-bar">
                        <span class="score-label">Relevance:</span>
                        <div class="score-bar-bg">
                            <div class="score-bar-fill" style="width: ${data.relevance_score}%"></div>
                        </div>
                        <span class="score-percent">${Math.round(data.relevance_score)}%</span>
                    </div>
                    
                    <div class="interpretation">${data.interpretation}</div>
                </div>
            `;
            
            contentDiv.innerHTML = responseHtml;
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
