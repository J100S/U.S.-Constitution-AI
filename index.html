<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🇺🇸 Constitution AI</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(180deg, #0a1f44 0%, #ffffff 50%, #b22234 100%);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: #0a1f44;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 5px solid #b22234;
  letter-spacing: 1px;
}

/* CHAT CONTAINER */
#chat-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#chat {
  width: 90%;
  max-width: 700px;
  height: 450px;
  background: rgba(255,255,255,0.95);
  border-radius: 15px;
  padding: 15px;
  overflow-y: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  border: 2px solid #0a1f44;
}

/* CHAT MESSAGES */
.message {
  margin: 10px 0;
  padding: 10px 14px;
  border-radius: 10px;
  max-width: 80%;
  line-height: 1.4;
}

.user {
  background: #0a1f44;
  color: white;
  margin-left: auto;
}

.bot {
  background: #f1f1f1;
  color: #111;
  border-left: 5px solid #b22234;
}

/* INPUT AREA */
#input-area {
  display: flex;
  justify-content: center;
  padding: 15px;
  background: white;
  border-top: 3px solid #0a1f44;
}

input {
  width: 60%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  margin-left: 10px;
  padding: 12px 20px;
  background: #b22234;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

button:hover {
  background: #8b1a2b;
  transform: scale(1.05);
}

/* SCROLLBAR */
#chat::-webkit-scrollbar {
  width: 8px;
}
#chat::-webkit-scrollbar-thumb {
  background: #0a1f44;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>🇺🇸 Constitution AI</header>

<div id="chat-container">
  <div id="chat"></div>
</div>

<div id="input-area">
  <input id="input" placeholder="Ask about rights, amendments, laws...">
  <button onclick="ask()">Ask</button>
</div>

<script src="script.js"></script>

</body>
</html>
