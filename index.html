<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🇺🇸 Constitutional AI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔥 MOBILE REDIRECT (SAFE VERSION) -->
<script>
(function () {

  function isMobileDevice() {
    return (
      window.innerWidth <= 768 ||
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    );
  }

  const path = window.location.pathname;

  const onMobilePage = path.includes("mobile.html");
  const onDesktopPage = path.includes("index.html");

  // wait until page is ready (prevents flicker)
  window.addEventListener("load", function () {

    if (isMobileDevice() && !onMobilePage) {
      window.location.href = "mobile.html";
    }

    if (!isMobileDevice() && !onDesktopPage && onMobilePage) {
      window.location.href = "index.html";
    }

  });

})();
</script>

<div class="bg"></div>

<div class="app">

  <div class="header">
    🇺🇸 Constitutional AI
    <span>Mobile Ready</span>
  </div>

  <div id="chat" class="chat"></div>

  <div class="inputArea">
    <input id="input" placeholder="Ask about US law, history..." />
    <button id="sendBtn">Send</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
